[workspace]
members = [".", "feldjaeger-ssh"]
resolver = "2"

[package]
name = "feldjaeger"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Local desktop control panel for managing remote Xray servers over SSH"
readme = "README.md"

[[bin]]
name = "feldjaeger"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
eframe = "0.35.0"
egui = "0.35.0"
feldjaeger-ssh = { path = "feldjaeger-ssh" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "std"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time"] }
