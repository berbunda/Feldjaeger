[workspace]
members = [".", "feldjaeger-ssh"]
resolver = "3"

[package]
name = "feldjaeger"
version = "0.5.15"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Local desktop control panel for managing remote Xray servers over SSH"
readme = "README.md"
repository = "https://github.com/berbunda/Feldjaeger"

[[bin]]
name = "feldjaeger"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
eframe = "0.36.1"
egui = "0.36.1"
feldjaeger-ssh = { path = "feldjaeger-ssh" }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "std"] }
uuid = { version = "1.24.1", features = ["v4"] }
base64 = "0.23.1"
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs", "std", "logging"] }
x509-parser = "0.18.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time"] }
